version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ajuste_hiperparametros_vivienda_california_service
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8501:8501"
      
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - ENVIRONMENT=production
    volumes:
      - ../data:/app/data
      - ../models:/app/models
    depends_on:
      - mlflow

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: ajuste_hiperparametros_vivienda_california_mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlflow_artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - ../mlruns:/mlflow_artifacts
