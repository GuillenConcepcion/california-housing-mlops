[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ajuste_hiperparametros_vivienda_california"
version = "0.1.0"
description = "Optimizacion de hiperparametros (max_depth, ccp_alpha, min_samples_split, min_samples_leaf, max_leaf_nodes) para DecisionTreeRegressor en el dataset California Housing."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Guillén Concepción", email = "guillenconcepcion@gmail.com" }
]
license = { text = "MIT" }
keywords = ["mlops", "machine-learning", "odysseus", "tabular_regression"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pydantic>=2.6.0",
    "joblib>=1.3.0",
    "mlflow>=2.10.0",
    "optuna>=3.4.0",
    "shap>=0.44.0",
    "catboost>=1.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "marimo>=0.8.0",
    "plotly>=5.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
